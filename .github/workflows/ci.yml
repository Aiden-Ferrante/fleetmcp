name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff mypy types-PyYAML
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: generated.py is current
        run: python -m fleetmcp.gen --check
      - name: Tests (offline; includes the stdio demo end to end)
        run: python -m pytest -q
