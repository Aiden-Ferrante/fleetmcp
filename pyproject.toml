[project]
name = "fleetmcp"
version = "0.2.0"
description = "One MCP server, generated from OpenAPI specs, that forwards the apps' refusals instead of deciding itself."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# requirements.txt is what the quickstart installs; keep the two in step.
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Docstrings and signatures are rendered verbatim from tools.yaml and the OpenAPI
# schemas; wrapping them would change the words the agent reads.
"fleetmcp/generated.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["fleetmcp", "demo"]
exclude = ["fleetmcp/generated\\.py$"]
warn_unused_ignores = true
